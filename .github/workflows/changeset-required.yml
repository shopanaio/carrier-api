name: Changeset Required

on:
  pull_request:
    paths:
      - '.changeset/**'
      - 'packages/**/package.json'
      - 'packages/**/src/**'
      - 'packages/**/scripts/**'
      - 'packages/**/build.js'
      - 'packages/**/rollup.config.js'
      - 'packages/**/rollup.config.mjs'
      - 'packages/**/tsup.config.ts'
      - 'packages/**/tsconfig.json'
      - 'tools/rollup-package.mjs'
      - '.github/workflows/changeset-required.yml'
      - 'tools/validate-changesets.mjs'

permissions:
  contents: read

jobs:
  changeset:
    name: Require changeset for package source changes
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Check changeset
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1

          changed_files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf '%s\n' "$changed_files"

          has_changeset=false
          changed_package_dirs=()
          changeset_files=()

          mapfile -t changed_package_dirs < <(
            printf '%s\n' "$changed_files" |
              sed -nE 's#^packages/([^/]+)/((src|scripts)/.*|package\.json|build\.js|rollup\.config\.m?js|tsup\.config\.ts|tsconfig\.json)$#packages/\1#p' |
              sort -u
          )

          # The shared rollup config is part of the build of every package whose rollup config imports it.
          if printf '%s\n' "$changed_files" | grep -qx 'tools/rollup-package.mjs'; then
            while IFS= read -r config; do
              changed_package_dirs+=("$(dirname "$config")")
            done < <(grep -l 'rollup-package.mjs' packages/*/rollup.config.mjs packages/*/rollup.config.js 2>/dev/null || true)
          fi

          # Private packages (e.g. demo-post-api-client) are never released and need no changeset.
          releasable_dirs=()
          for package_dir in "${changed_package_dirs[@]}"; do
            if [[ -f "$package_dir/package.json" ]] && node -e 'process.exit(require(process.argv[1]).private === true ? 0 : 1)' "$PWD/$package_dir/package.json"; then
              echo "Skipping private package $package_dir"
              continue
            fi
            releasable_dirs+=("$package_dir")
          done
          if [[ "${#releasable_dirs[@]}" -gt 0 ]]; then
            mapfile -t changed_package_dirs < <(printf '%s\n' "${releasable_dirs[@]}" | sort -u)
          else
            changed_package_dirs=()
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^\.changeset/[^/]+\.md$'; then
            has_changeset=true
            mapfile -t changeset_files < <(printf '%s\n' "$changed_files" | grep -E '^\.changeset/[^/]+\.md$')
          fi

          if [[ "$has_changeset" == "true" ]]; then
            validator_args=()
            for package_dir in "${changed_package_dirs[@]}"; do
              validator_args+=(--changed-package-dir "$package_dir")
            done
            node tools/validate-changesets.mjs "${validator_args[@]}" -- "${changeset_files[@]}"
          fi

          if [[ "${#changed_package_dirs[@]}" -eq 0 && "$has_changeset" == "true" ]]; then
            echo "::error::Changeset-only pull requests are not allowed. Include the package source change in the same pull request."
            exit 1
          fi

          if [[ "${#changed_package_dirs[@]}" -eq 0 ]]; then
            echo "No releasable package changes detected."
            exit 0
          fi

          if [[ "$has_changeset" == "true" ]]; then
            echo "Changeset found."
            exit 0
          fi

          echo "::error::Package source, build, and manifest changes require a changeset. Run yarn changeset and commit the generated .changeset/*.md file."
          exit 1
