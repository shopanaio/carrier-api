name: Release

on:
  push:
    branches:
      - main
      - beta
    paths:
      - '.changeset/**'
      - 'packages/**/package.json'
      - 'packages/**/src/**'
      - 'packages/**/scripts/**'
      - 'packages/**/build.js'
      - 'packages/**/rollup.config.js'
      - 'packages/**/rollup.config.mjs'
      - 'packages/**/tsup.config.ts'
      - 'packages/**/tsconfig.json'
      - 'tools/rollup-package.mjs'
      - 'tools/publish-beta.mjs'
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish packages
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Trusted Publishing is preferred. NPM_TOKEN is only needed to bootstrap
      # packages that do not exist on npm yet and therefore cannot have a
      # trusted publisher configured in the npm package settings.
      - name: Configure npm token fallback
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo "NODE_AUTH_TOKEN=$NPM_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Validate source changes have changesets
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          changed_files="$(git diff --name-only "$before" "$after")"
          printf '%s\n' "$changed_files"

          has_package_source=false
          has_package_manifest=false
          has_changeset=false

          if printf '%s\n' "$changed_files" | grep -Eq '^packages/[^/]+/((src|scripts)/|build\.js$|rollup\.config\.m?js$|tsup\.config\.ts$|tsconfig\.json$)'; then
            has_package_source=true
          fi

          # The shared rollup config changes the build output of every package that uses it.
          if printf '%s\n' "$changed_files" | grep -qx 'tools/rollup-package.mjs'; then
            has_package_source=true
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^packages/[^/]+/package\.json$'; then
            has_package_manifest=true
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^\.changeset/[^/]+\.md$'; then
            has_changeset=true
          fi

          # In pre mode, versioning retains the Markdown Changesets and records
          # consumed IDs in pre.json. Accept version-only beta updates as well.
          if [[ "${{ github.ref_name }}" == "beta" && "$has_package_source" == "false" && "$has_package_manifest" == "true" ]] &&
            printf '%s\n' "$changed_files" | grep -qx '.changeset/pre.json'; then
            node --input-type=module - "$before" "$after" <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const pre = JSON.parse(readFileSync('.changeset/pre.json', 'utf8'));
          if (pre.mode !== 'pre' || pre.tag !== 'beta' || pre.changesets.length === 0) {
            throw new Error('Expected a versioned beta prerelease state');
          }
          const manifests = execFileSync('git', ['diff', '--name-only', ...process.argv.slice(2)], { encoding: 'utf8' })
            .trim().split('\n').filter(path => /^packages\/[^/]+\/package\.json$/.test(path));
          for (const path of manifests) {
            const pkg = JSON.parse(readFileSync(path, 'utf8'));
            if (!pkg.private && !/^\d+\.\d+\.\d+-beta\.\d+$/.test(pkg.version)) {
              throw new Error(`Expected a beta version for ${pkg.name}`);
            }
          }
          NODE
            echo "Beta package version update detected."
            exit 0
          fi

          if [[ "$has_package_source" == "false" && "$has_package_manifest" == "false" && "$has_changeset" == "true" ]]; then
            echo "::error::Changeset-only pushes are not allowed to trigger release automation."
            exit 1
          fi

          if [[ "$has_package_source" == "false" && "$has_package_manifest" == "false" ]]; then
            echo "No releasable package changes detected."
            exit 0
          fi

          if [[ "$has_changeset" == "true" ]]; then
            echo "Changeset found."
            exit 0
          fi

          echo "::error::Package source, build, and manifest changes require a changeset before release automation can run."
          exit 1

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn version:packages
          publish: ${{ github.ref_name == 'beta' && 'yarn release:beta' || 'yarn release:stable' }}
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
